[env:esp32s3-n16r8-st7735s]
extends = env
board = esp32s3-n16r8-st7735s
board_build.partitions = custom_16Mb.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
build_src_filter = ${env.build_src_filter} -<../boards/ESP-General/interface.cpp> +<../boards/esp32s3-n16r8-st7735s_board>
# LTO is disabled on purpose: the whole-program LTO link step fails with
# "No module named 'SCons.Tool.FortranCommon'". Dropping -flto from the
# compile flags (rather than appending -fno-lto) keeps the linker out of LTO
# mode entirely. Costs about 1-2% extra flash size.
build_unflags = -flto
build_flags =
    ${env.build_flags}
    -Iboards/esp32s3-n16r8-st7735s
    -DBOARD_HAS_PSRAM=1
    -DUSER_SETUP_LOADED=1
    ; --- ST7735S 128x160, vendor pinout of this board ---
    -DST7735_DRIVER
    -DST7735_REDTAB
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=46
    -DTFT_DC=9
    -DTFT_RST=10
    -DTFT_BL=3
    -DROTATION=1
    -DBACKLIGHT=3
    -DTFT_DISPON=0x29
    -DTFT_DISPOFF=0x28
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    ; --- CC1101 sub-GHz, own SPI signals ---
    -DSPI_SCK_PIN=18
    -DSPI_MISO_PIN=8
    -DSPI_MOSI_PIN=17
    -DSPI_SS_PIN=15
    -DCC1101_SS_PIN=15
    -DCC1101_GDO0_PIN=16
    -DCC1101_GDO2_PIN=6
    -DCC1101_MOSI_PIN=17
    -DCC1101_SCK_PIN=18
    -DCC1101_MISO_PIN=8
    ; --- three user buttons: LEFT / SELECT / RIGHT ---
    -DUP_BTN=21
    -DSEL_BTN=48
    -DDW_BTN=47
    -DBTN_ALIAS='"OK"'
    -DDEVICE_NAME='"ESP32S3N16R8ST7735S"'
