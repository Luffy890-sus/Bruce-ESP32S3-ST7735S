[env:esp32s3-n16r8-st7735s]
extends = env
board = esp32s3-n16r8-st7735s
board_build.partitions = custom_16Mb.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
build_src_filter = ${env.build_src_filter} -<../boards/ESP-General/interface.cpp> +<../boards/esp32s3-n16r8-st7735s_board>
# LTO is disabled on purpose: the whole-program LTO link step fails with
# "No module named 'SCons.Tool.FortranCommon'". Dropping -flto from the
# compile flags (rather than appending -fno-lto) keeps the linker out of LTO
# mode entirely. Costs about 1-2% extra flash size.
build_unflags = -flto
build_flags =
    ${env.build_flags}
    -Iboards/esp32s3-n16r8-st7735s
    -DBOARD_HAS_PSRAM=1
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER
    -DST7735_REDTAB
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DTFT_MOSI=17
    -DTFT_SCLK=18
    -DTFT_CS=8
    -DTFT_DC=9
    -DTFT_RST=15
    -DTFT_BL=21
    -DROTATION=1
    -DBACKLIGHT=21
    -DTFT_DISPON=0x29
    -DTFT_DISPOFF=0x28
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DSPI_SCK_PIN=18
    -DSPI_MOSI_PIN=17
    -DSPI_MISO_PIN=19
    -DSPI_SS_PIN=10
    -DUP_BTN=5
    -DSEL_BTN=4
    -DDW_BTN=6
    -DBTN_ALIAS='"OK"'
    -DDEVICE_NAME='"ESP32S3N16R8ST7735S"'
